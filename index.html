<title>Little Snowy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --panel:rgba(32,22,42,.9); --panel2:rgba(48,34,62,.96); --line:rgba(255,255,255,.09);
  --text:#fff4fb; --muted:#cbb8d8; --pink:#ff7eb6; --pink2:#e0569a; --green:#7fe08a;
  --bg:#1b1220; --track:rgba(255,255,255,.12); --ink:#3a2140;
  color-scheme:dark;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --panel:rgba(255,246,252,.93); --panel2:rgba(255,238,248,.97); --line:rgba(120,70,140,.14);
    --text:#3b2342; --muted:#86668f; --track:rgba(120,70,140,.14); color-scheme:light;
  }
}
:root[data-theme="dark"]{ --panel:rgba(32,22,42,.9); --panel2:rgba(48,34,62,.96); --text:#fff4fb; --muted:#cbb8d8; color-scheme:dark; }
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:"Fredoka",ui-rounded,"SF Pro Rounded",system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.gi{width:1em;height:1em;display:inline-block;vertical-align:middle;overflow:visible;filter:drop-shadow(0 2px 0 rgba(0,0,0,.22))}
#app{position:relative;height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;
  background:linear-gradient(180deg,#2e1f2e 0%,#3a2630 60%,#4a2f2a 100%);overflow:hidden}

/* top */
.top{display:flex;gap:8px;padding:10px 10px 6px;z-index:5}
.profile{flex:1;display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:6px 12px 6px 6px;min-width:0}
.ava{width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 50% 40%,#fff1f8,#f2c6dc);border:3px solid var(--pink);overflow:hidden;flex:none;display:grid;place-items:center;font-size:30px}
.ava svg:not(.gi){width:100%;height:100%}
.pname{font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plevel{font-size:12px;color:var(--muted)}
.bar{height:8px;border-radius:8px;background:var(--track);overflow:hidden;margin-top:3px}
.bar>i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,#ff9cc9,var(--pink));transition:width .5s}
.xpt{font-size:10px;color:var(--muted);text-align:right;margin-top:1px}
.cur{display:flex;flex-direction:column;gap:6px}
.pill{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:3px 10px 3px 4px;min-width:94px;font-weight:600;font-size:15px}
.pill .ic{font-size:24px;display:flex}

/* scene */
.mid{position:relative;flex:1;min-height:0}
.scene{position:absolute;inset:0;width:100%;height:100%}
.side{position:absolute;top:8px;display:flex;flex-direction:column;gap:8px;z-index:4}
.side.l{left:10px}.side.r{right:10px}
.sbtn{position:relative;width:66px;padding:6px 2px 6px;background:var(--panel);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:500;line-height:1.1;transition:transform .1s}
.sbtn .e{font-size:34px;display:flex}
.dot{position:absolute;top:-3px;right:-3px;width:14px;height:14px;border-radius:50%;background:#ff4f7b;border:2px solid #fff;display:none}

/* status */

let AC,SFX,MUS,NB;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();SFX=AC.createGain();SFX.gain.value=.9;SFX.connect(AC.destination);MUS=AC.createGain();MUS.gain.value=0;MUS.connect(AC.destination)}catch(e){return null}}if(AC.state==='suspended'&&!document.hidden)AC.resume();return AC}
function note(f,t0,d,type='sine',v=.08,dest,slide){if(!ac())return;const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t0);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t0+d);g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(v,t0+.01);g.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(g).connect(dest||SFX);o.start(t0);o.stop(t0+d+.05)}
function noise(t,d,v,hp,dest){if(!ac())return;if(!NB){NB=AC.createBuffer(1,AC.sampleRate*.5,AC.sampleRate);const c=NB.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=Math.random()*2-1}const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=NB;f.type='highpass';f.frequency.value=hp;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f).connect(g).connect(dest||SFX);s.start(t);s.stop(t+d+.02)}
function sfx(n,arg){if(!S.sound||!ac())return;const t=AC.currentTime;switch(n){
case'pop':note(500,t,.07,'sine',.05,null,850);break;
case'chirp':note(1400,t,.06,'sine',.035,null,1900);note(1700,t+.07,.08,'sine',.03,null,2300);break;
case'pet':note(520,t,.22,'sine',.08,null,880);note(1046,t+.1,.25,'triangle',.035);note(1318,t+.18,.3,'triangle',.03);break;
case'warm':{const b=500+(arg||0)*7;note(b,t,.12,'triangle',.06,null,b*1.5);note(b*2,t+.05,.2,'sine',.03);break}
case'crack':noise(t,.09,.25,1800);noise(t+.07,.06,.18,2600);note(180,t,.08,'square',.03,null,90);break;
case'drop':note(1200,t,.5,'sine',.04,null,400);break;
case'gulp':note(320,t,.16,'sine',.14,null,140);note(300,t+.17,.16,'sine',.11,null,130);[784,1046].forEach((f,i)=>note(f,t+.36+i*.08,.2,'triangle',.04));break;
case'coin':note(988,t,.08,'square',.035);note(1319,t+.07,.25,'square',.035);break;
case'sparkle':[1568,2093,2637].forEach((f,i)=>note(f,t+i*.05,.25,'sine',.035));break;
case'boing':{const b=280+(arg||0)*60;note(b,t,.28,'sine',.1,null,b*2.4);note(b*3,t+.04,.12,'triangle',.03);break}
case'toss':note(900,t,.25,'sine',.04,null,1600);break;
case'snore':note(220,t,.6,'sine',.05,null,160);note(180,t+.5,.6,'sine',.04,null,150);break;
case'wish':[784,988,1175,1568].forEach((f,i)=>note(f,t+i*.07,.3,'triangle',.05));break;
case'level':[523,659,784,1046].forEach((f,i)=>{note(f,t+i*.1,.35,'triangle',.07);note(f*2,t+i*.1,.2,'sine',.02)});note(1318,t+.45,.8,'triangle',.06);note(1046,t+.45,.8,'sine',.04);note(784,t+.45,.8,'sine',.03);break;}}
const chime=()=>sfx('level');
/* music-box lullaby */
const mtof=m=>440*Math.pow(2,(m-69)/12);
const CH=[[60,64,67],[55,59,62],[57,60,64],[53,57,60],[60,64,67],[53,57,60],[55,59,62],[60,64,67]];
const MEL=[[76,0,79,0,76,74,72,0],[74,0,71,0,74,0,79,0],[72,0,76,0,81,79,76,0],[77,0,76,0,74,0,72,0],[76,0,79,0,84,0,83,81],[81,0,77,0,72,0,77,0],[79,0,76,74,71,0,74,0],[72,0,0,0,67,0,71,0]];
let musT=null,musStep=0,musNext=0;
function musicTick(){if(!AC)return;const spb=60/88/2;if(musNext<AC.currentTime)musNext=AC.currentTime+.05;while(musNext<AC.currentTime+.25){schedule(musStep,musNext,spb);musStep=(musStep+1)%64;musNext+=spb}}
function schedule(i,t,spb){const bar=i>>3,s=i&7,ch=CH[bar],m=MEL[bar][s];
  note(mtof(ch[[0,1,2,1,0,1,2,1][s]]+12),t,spb*1.8,'sine',.022,MUS);
  if(m){note(mtof(m),t,.9,'triangle',.055,MUS);note(mtof(m+12),t,.5,'sine',.014,MUS)}
  if(s===0||s===4)note(mtof(ch[0]-12),t,spb*3.5,'sine',.055,MUS)}
function startMusic(){if(!S.music||!ac())return;if(!musT){musNext=AC.currentTime+.1;musT=setInterval(musicTick,60)}MUS.gain.cancelScheduledValues(AC.currentTime);MUS.gain.setTargetAtTime(asleep()?.5:1,AC.currentTime,.5)}
function stopMusic(){if(!AC)return;MUS.gain.cancelScheduledValues(AC.currentTime);MUS.gain.setTargetAtTime(0,AC.currentTime,.15);clearInterval(musT);musT=null}

function avaSVG(){if(S.stage==='egg')return ic('egg');

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function renderPet(){

function moodOf(){if(asleep())return['😴','Sleeping','#a9c2ff'];if(S.fullness<30)return['🥺','Hungry','#ffb36b'];if(S.happiness<35)return['🥺','Needs love','#ffb36b'];

    <div class="stat"><span>${ic('flame')}</span><span>Warmth</span><div class="bar w"><i style="width:${S.warmth}%"></i></div><b>${Math.floor(S.warmth)}%</b></div>`;return}

  <div class="stat"><span>${ic('heart')}</span><span>Happiness</span><div class="bar h"><i style="width:${S.happiness}%"></i></div><b>${Math.round(S.happiness)}%</b></div>
  <div class="stat"><span>${ic('bowl')}</span><span>Fullness</span><div class="bar f"><i style="width:${S.fullness}%"></i></div><b>${Math.round(S.fullness)}%</b></div>
  <div class="stat"><span>${ic('star')}</span><span>Growth</span><div class="bar g"><i style="width:${g}%"></i></div><b>${g}%</b></div>`;

function renderActs(){

  a.className='acts';a.innerHTML=`<button class="act a2" id="aFeed"><span class="e">${ic('mouse')}</span>Feed<small>Snack time</small></button>

function dots(){$('dDaily').classList.toggle('on',S.daily.last!==today());$('dLove').classList.toggle('on',!S.anniv);resetMissions();
  $('dMiss').classList.toggle('on',MISSIONS.some(m=>!S.m.claimed[m.id]&&(S.m[m.id]||0)>=m.goal))}

/* ===== fx ===== */
function fx(x,y,html,color='#fff',size=20){const d=document.createElement('div');d.className='fx';d.innerHTML=html;d.style.left=(x-12)+'px';d.style.top=(y-20)+'px';d.style.color=color;d.style.fontSize=size+'px';d.style.textShadow='0 2px 6px rgba(0,0,0,.5)';document.body.appendChild(d);setTimeout(()=>d.remove(),1200)}
function hearts(x,y,n=4){for(let i=0;i<n;i++)setTimeout(()=>fx(x+(Math.random()*60-30),y+(Math.random()*20),ic(i%3===2?'star':'heart'),'#fff',22+Math.random()*10),i*80)}
function confetti(n=40){const k=['heart','star','bow','flower','coin','gem'];for(let i=0;i<n;i++){const d=document.createElement('div');d.className='conf';d.innerHTML=ic(k[i%6]);d.style.fontSize=(18+Math.random()*14)+'px';d.style.left=Math.random()*100+'vw';d.style.animationDuration=(1.8+Math.random()*1.6)+'s';d.style.animationDelay=Math.random()*.6+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),4200)}}
function toast(t){document.querySelectorAll('.toast').forEach(x=>x.remove());const d=document.createElement('div');d.className='toast';d.innerHTML=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1900)}
let bubT;function say(t){sfx('chirp');const p=$('pet');p.querySelectorAll('.bubble').forEach(b=>b.remove());const b=document.createElement('div');b.className='bubble';b.textContent=t;p.appendChild(b);clearTimeout(bubT);bubT=setTimeout(()=>b.remove(),2200)}
function anim(cls){const el=$('petInner');if(!el)return;const base=el.className.replace(/\b(bounce|wobble|shake)\b/g,'').trim();el.className=base;void el.offsetWidth;el.className=base+' '+cls;setTimeout(()=>{el.className=base},cls==='shake'?1300:520)}
function center(){const r=$('pet').getBoundingClientRect();return[r.left+r.width/2,r.top+r.height*.35]}
function pt(e){if(e&&e.clientX)return[e.clientX,e.clientY];return center()}

/* ===== egg ===== */
function warm(e){
  if(S.stage!=='egg')return;S.warmth=Math.min(100,S.warmth+4+Math.random()*3);
  const[x,y]=e&&e.currentTarget===$('pet')?pt(e):center();fx(x,y,ic('flame'),'#fff',26);sfx('warm',S.warmth);
  if(S.warmth>=100){save();hatch();return}
  render();anim('wobble');save();
}
function hatch(){
  S.stage='hatching';sfx('crack');setTimeout(()=>sfx('crack'),450);setTimeout(()=>sfx('crack'),900);anim('shake');
  setTimeout(()=>{S.stage='born';S.level=1;S.xp=0;S.last=Date.now();S.nextWish=Date.now()+5*6e4;chime();confetti(60);render();anim('bounce');
    setTimeout(()=>nameModal(true),700);save()},1300);
}
function nameModal(first){
  modal(`<div class="mini">${snakeSVG()}</div><h2>${first?'It’s a little white snake!':'Rename your snake'}</h2>
  <p class="hint">${first?'What should we call this tiny noodle?':'Pick a new name.'}</p>
  <input class="name" id="nm" maxlength="14" value="${esc(S.name)}"><button class="btn wide" id="nmok">${first?'Say hello':'Save name'}</button>`);
  const i=$('nm');setTimeout(()=>i.select(),100);
  $('nmok').onclick=()=>{S.name=(i.value.trim()||'Snowy').slice(0,14);if(first){S.coins+=50}closeOv();save();render();
    if(first){toast('Welcome, '+esc(S.name)+'! +50 '+ic('coin'));sfx('coin');setTimeout(()=>say('Hi! I love you already 💕'),500)}};
}

/* ===== care ===== */
let lastPet=0;
function pet(e){
  if(S.stage!=='born')return;const now=Date.now();if(now-lastPet<300)return;lastPet=now;
  if(asleep()){const[x,y]=pt(e);fx(x,y,'💤','#fff',22);sfx('snore');say(['zzz… love you…','mmm… five more minutes','*sleepy wiggle*'][Math.floor(Math.random()*3)]);S.happiness=Math.min(100,S.happiness+1);save();renderStatus();return}
  const[x,y]=pt(e);hearts(x,y,3);sfx('pet');anim('bounce');
  S.happiness=Math.min(100,S.happiness+4);S.m.pet++;wishProgress('miss');if(S.happiness>=100)S.m.love=1;
  if(S.petXp.date!==today())S.petXp={date:today(),n:0};
  if(S.petXp.n<40){S.petXp.n++;addXP(3)}
  if(Math.random()<.3)say(LOVE[Math.floor(Math.random()*LOVE.length)]);
  save();render();
}
function feed(k){
  const f=FOOD[k];if(S.fullness>=96){closeOv();say('I’m so full! 🥺');return}
  if(!S.inv[k]){toast('Out of '+f.name.toLowerCase()+'s. Buy more in the shop.');return}
  S.inv[k]--;closeOv();
  const d=document.createElement('div');d.className='food-drop';d.innerHTML=ic(f.icon);$('mid').appendChild(d);sfx('drop');
  setTimeout(()=>{d.remove();S.fullness=Math.min(100,S.fullness+f.full);S.happiness=Math.min(100,S.happiness+f.happy);S.m.feed++;if(S.happiness>=100)S.m.love=1;wishProgress('hungry');
    const[x,y]=center();fx(x,y,'+'+f.xp+' XP','#b9ff9e');sfx('gulp');
    anim('bounce');say(['Yummy! 😋','Nom nom nom','Thank you! 💕','Delicious!'][Math.floor(Math.random()*4)]);addXP(f.xp);save();render()},950);
}
/* play ball in the terrarium */
let playing=false;
function play(){
  if(S.stage!=='born'||playing)return;if(asleep())return wakeAsk(play);
  if(S.fullness<15){say('Too hungry to play 🥺');return}
  playing=true;let hits=0;const goal=5;
  const b=document.createElement('button');b.className='toy';b.setAttribute('aria-label','Toy ball, tap it');b.innerHTML=ic('ball');
  const place=()=>{b.style.left=(20+Math.random()*60)+'%';b.style.top=(22+Math.random()*38)+'%'};
  b.style.left='50%';b.style.top='-10%';$('mid').appendChild(b);requestAnimationFrame(()=>requestAnimationFrame(place));
  sfx('toss');say('A ball! Tap it! ✨');
  const end=()=>{clearTimeout(timer);b.remove();playing=false;
    const pct=hits/goal,coins=Math.round(12*pct),xp=Math.round(14*pct);
    if(hits===0){say('Aww, maybe later?');return}
    S.coins+=coins;S.happiness=Math.min(100,S.happiness+Math.round(20*pct));S.fullness=Math.max(10,S.fullness-4);S.m.play++;S.lastPlay=Date.now();if(S.happiness>=100)S.m.love=1;wishProgress('bored');wishProgress('play');
    const[x,y]=center();fx(x,y-20,`+${coins} ${ic('coin')}`,'#ffe27a',22);sfx('coin');addXP(xp);
    say(hits>=goal?'Again! Again! 💕':'That was fun!');save();render()};
  const timer=setTimeout(end,12000);
  b.onclick=e=>{e.stopPropagation();hits++;sfx('boing',hits);const r=b.getBoundingClientRect();hearts(r.left+r.width/2,r.top,2);anim('bounce');
    b.classList.remove('hop');void b.offsetWidth;b.classList.add('hop');
    if(hits>=goal){setTimeout(end,350)}else place()};
}
function addXP(n){
  S.xp+=n;let ups=0;while(S.xp>=need(S.level)){S.xp-=need(S.level);const old=stageOf(S.level).name;S.level++;ups++;
    const nu=stageOf(S.level).name;const reward=30+S.level*10;S.coins+=reward;S.gems+=S.level%5===0?2:0;
    setTimeout(()=>levelUp(old!==nu,reward),400+ups*50)}
}
function levelUp(grew,reward){
  chime();confetti(grew?70:35);render();anim('bounce');
  const st=stageOf(S.level);
  modal(`<div class="mini" style="width:${grew?150:120}px">${snakeSVG()}</div><h2>${grew?esc(S.name)+' grew into a '+st.name.toLowerCase()+'!':'Level '+S.level+'!'}</h2>
  <p class="hint">${grew?(st.name==='Royal'?'A true snow queen. Look at that sparkle.':'Look how big your noodle is getting.'):'Your snake is getting stronger.'}</p>
  <p style="font-size:20px;font-weight:600;margin:6px 0">+${price(reward,'coins')}${S.level%5===0?'  +'+price(2,'gems'):''}</p><button class="btn wide" onclick="closeOv()">Yay!</button>`);
}

/* ===== modal / sheet ===== */

function openWard(){

  const owned=S.owned.map(k=>`<div class="item"><span class="e">${ic(k)}</span><div class="t"><b>${ITEMS[k].name}</b></div><button class="btn ${S.eq===k?'alt':''}" data-eq="${k}">${S.eq===k?'Take off':'Wear'}</button></div>`).join('');
  sheet(`<h2>Wardrobe</h2><p class="hint">${owned?'Pick something cute to wear.':'Nothing here yet. Buy accessories in the shop.'}</p><div class="list">${owned}</div>${owned?'':'<button class="btn wide" data-tab="acc">Go to shop</button>'}`);
  bindSheet(openWard);setNav('nWard');

function bindSheet(reopen){
  const o=$('ov');if(!o)return;
  o.querySelectorAll('[data-feed]').forEach(b=>b.onclick=()=>feed(b.dataset.feed));
  o.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>openShop(b.dataset.tab));
  o.querySelectorAll('[data-buyf]').forEach(b=>b.onclick=()=>{const f=FOOD[b.dataset.buyf];const c=f.cur||'coins';
    if(S[c]<f.price){toast('Not enough '+(c==='gems'?'gems':'coins')+' yet. Play ball to earn more!');return}
    S[c]-=f.price;S.inv[b.dataset.buyf]=(S.inv[b.dataset.buyf]||0)+1;sfx('coin');toast('Bought '+f.name.toLowerCase()+' '+ic(f.icon));save();render();reopen()});
  o.querySelectorAll('[data-buyi]').forEach(b=>b.onclick=()=>{const k=b.dataset.buyi,it=ITEMS[k];

    S[it.cur]-=it.price;S.owned.push(k);S.eq=k;chime();toast(esc(S.name)+' is wearing the '+it.name.toLowerCase()+'!');save();render();reopen()});
  o.querySelectorAll('[data-eq]').forEach(b=>b.onclick=()=>{const k=b.dataset.eq;S.eq=S.eq===k?null:k;sfx('sparkle');save();render();reopen()});
}
function openDaily(){

  $('dok').onclick=()=>{S.daily={last:today(),streak};S.coins+=c;S.gems+=g;S.inv.mouse++;chime();confetti(25);save();closeOv();render()};

function resetMissions(){if(S.m.date!==today())S.m={date:today(),feed:0,pet:0,play:0,love:0,claimed:{}}}

IC.bell=`<path d="M24 6 C15 6 12 14 12 22 V30 L8 35 H40 L36 30 V22 C36 14 33 6 24 6Z" fill="#ffd54a" ${O}/><circle cx="24" cy="39" r="4" fill="#ffb12e" ${O}/>${SHINE(16,13)}`;
IC.letter=`<rect x="5" y="12" width="38" height="28" rx="4" fill="#fff6fb" ${O}/><path d="M5 15 L24 29 L43 15" fill="none" ${O}/><path d="${HEART}" fill="#ff5c9e" stroke="#3a2140" stroke-width="7" transform="translate(16.5 21) scale(.32)"/>`;
IC.love=`<path d="M6 36 L8 15 L17 24 L24 10 L31 24 L40 15 L42 36Z" fill="#ffb0d4" ${O}/><rect x="6" y="34" width="36" height="8" rx="2.5" fill="#ff6fae" ${O}/><g fill="#ff4f7b" stroke="#3a2140" stroke-width="8"><path d="${HEART}" transform="translate(19.4 1) scale(.2)"/><path d="${HEART}" transform="translate(3.4 6) scale(.2)"/><path d="${HEART}" transform="translate(35.4 6) scale(.2)"/><path d="${HEART}" transform="translate(18.6 22) scale(.24)"/></g>`;
function openLove(){
  modal(`<div class="bigic env-w" id="envB" style="font-size:100px">${ic('letter')}</div><h2>A letter for you</h2><p class="hint">Tap the envelope to open it</p>`);
  sfx('chirp');
  $('envB').onclick=()=>{chime();confetti(50);const first=!S.anniv;
    modal(`<div class="letter"><div class="l30">30</div><h2>Happy 30 days of us!</h2>
    <p>Thirty days of you being my favorite person. I made you this little game so you always have something cute in your pocket, just like you are for me.</p>
    <p>Here’s to every day after this one. I love you 💕</p>
    <p class="sig">Me, and Snowy 🐍</p></div>
    ${first?`<p style="font-weight:600;margin:14px 0 0">Your gift: ${ic('love')} Love crown, +${price(300,'coins')} +${price(10,'gems')}</p>`:''}
    <button class="btn wide" id="lok">${first?'Open my gift':'Close'}</button>`);
    $('lok').onclick=()=>{if(first){S.anniv=1;S.coins+=300;S.gems+=10;if(!S.owned.includes('love'))S.owned.push('love');if(S.stage==='born')S.eq='love';sfx('coin');confetti(30);save()}
      closeOv();render();if(S.stage==='born')setTimeout(()=>say('Happy 30 days! 💕'),400);else if(first)toast('Love crown saved for when Snowy hatches '+ic('love'))}};
}
function isNight(){const h=new Date().getHours();return h>=22||h<7}
function asleep(){return S.stage==='born'&&isNight()&&!((S.wokeUntil||0)>Date.now())}
const WISH={hungry:{ic:'mouse',say:'I’m hungry… can I have a snack? 🥺',act:'aFeed'},
  bored:{ic:'ball',say:'I’m so bored! Play ball with me?',act:'aPlay'},
  play:{ic:'ball',say:'Wanna play? Pleeease ✨',act:'aPlay'},
  miss:{ic:'heart',say:'I missed you… pet me? 🥺',act:'aPet',need:3}};
function zzzHTML(sc){return`<div class="zzz" style="top:${(100-58*sc).toFixed(0)}%"><span>z</span><span>z</span><span>Z</span></div>`}
function wishHTML(sc){if(!S.wish)return'';return`<button class="wish" id="wishB" style="top:${Math.max(0,100-100*sc+4).toFixed(0)}%" aria-label="What ${esc(S.name)} wants">${ic(WISH[S.wish.t].ic)}<i></i><i></i></button>`}
function applyNight(){const n=isNight();$('night').classList.toggle('on',n);$('nlight').classList.toggle('on',n)}
function applyWish(){document.querySelectorAll('.act.want').forEach(a=>a.classList.remove('want'));if(S.wish&&!asleep()){const a=$(WISH[S.wish.t].act);if(a)a.classList.add('want')}}
function newWish(t){if(S.stage!=='born'||asleep())return;
  if(!t)t=S.fullness<45?'hungry':(Date.now()-(S.lastPlay||0)>3*36e5?'bored':(Math.random()<.5?'play':'miss'));
  S.wish={t,n:0};save();render();if(!$('splash')&&!$('ov'))say(WISH[t].say)}
function wishCheck(){if(S.stage==='born'&&!S.wish&&!asleep()&&Date.now()>(S.nextWish||0))newWish()}
function wishProgress(t){if(!S.wish||S.wish.t!==t)return;S.wish.n=(S.wish.n||0)+1;if(S.wish.n>=(WISH[t].need||1)){S.wish=null;setTimeout(wishDone,800)}}
function wishDone(){S.coins+=15;S.nextWish=Date.now()+(20+Math.random()*25)*6e4;sfx('wish');confetti(16);addXP(10);
  say('Yay! You remembered 💕');toast('Wish granted! +15 '+ic('coin'));save();render()}
function wakeAsk(cb){modal(`<div class="bigic">💤</div><h2>${esc(S.name)} is sleeping</h2><p class="hint">It’s nighttime. Let ${esc(S.name)} sleep, or wake it up for a little while?</p>
  <button class="btn wide" id="wk">Wake ${esc(S.name)} up</button><button class="btn alt wide" onclick="closeOv()">Let ${esc(S.name)} sleep</button>`);
  $('wk').onclick=()=>{S.wokeUntil=Date.now()+60*6e4;wasAsleep=false;save();closeOv();render();if(musT)startMusic();say('*yawn* …okay, I’m up! 🥱');setTimeout(cb,1100)}}
function goodMorning(){if(S.stage!=='born'||S.gm===today())return false;const hr=new Date().getHours();if(hr<7||hr>=12)return false;
  S.gm=today();S.coins+=20;save();render();chime();confetti(18);fx(innerWidth/2,innerHeight*.3,'☀️','#fff',54);
  say('Good morning! ☀️ I dreamed about you');setTimeout(()=>toast('Morning gift +20 '+ic('coin')),600);return true}
let wasAsleep=null;
function nightCheck(){const a=asleep();if(wasAsleep===null){wasAsleep=a;return}if(a!==wasAsleep){wasAsleep=a;if(musT)startMusic();if(a){S.wish=null;setTimeout(()=>say('Goodnight… 💤'),300)}else setTimeout(goodMorning,300)}}
function greet(){if(S.stage!=='born')return;if(asleep()){say('zzz… 💤');return}if(goodMorning())return;
  if(AWAY>6*36e5){say('I missed you so much! 🥺💕');if(!S.wish)newWish('miss')}else if(AWAY>36e5)say('Yay, you’re back! 💕');else if(S.wish)say(WISH[S.wish.t].say)}
function setNav(id){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.id===id))}

/* ===== time ===== */
function tick(){
  const now=Date.now(),min=(now-S.last)/6e4;S.last=now;
  if(S.stage==='born'&&min>0){S.fullness=Math.max(10,S.fullness-min/5);S.happiness=Math.max(10,S.happiness-min/7)}
  S.seenAt=now;nightCheck();wishCheck();save();if(!playing)render();
}

/* ===== splash ===== */
function setupSplash(){
  $('spHero').innerHTML=S.stage==='born'?snakeSVG(asleep()):eggSVG();
  const fl=$('spFloat'),k=['heart','star','flower','bow','heart'];
  for(let i=0;i<14;i++){const s=document.createElement('span');s.innerHTML=ic(k[i%5]);s.style.left=Math.random()*100+'%';s.style.fontSize=(16+Math.random()*18)+'px';s.style.animationDuration=(7+Math.random()*7)+'s';s.style.animationDelay=(-Math.random()*12)+'s';fl.appendChild(s)}
  const ua=navigator.userAgent,ios=/iPhone|iPad|iPod/.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1),android=/Android/.test(ua);
  const standalone=(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone;
  if(standalone){$('spTip').style.display='none'}
  const steps=ios?[`Tap the Share button ${SHARE} in Safari`,'Scroll down and tap <b>Add to Home Screen</b>','Tap <b>Add</b>, then open Little Snowy from your home screen']
    :android?['Tap the <b>⋮</b> menu in Chrome','Tap <b>Add to Home screen</b>','Tap <b>Add</b>, then open Little Snowy from your home screen']
    :[`iPhone: tap Share ${SHARE}, then <b>Add to Home Screen</b>`,'Android: tap the <b>⋮</b> menu, then <b>Add to Home screen</b>'];
  $('spSteps').innerHTML=steps.map((s,i)=>`<li><i>${i+1}</i><span>${s}</span></li>`).join('');
  $('spPlay').onclick=()=>{ac();startMusic();chime();confetti(24);$('splash').classList.add('out');setTimeout(()=>$('splash').remove(),550);
    if(!S.anniv)setTimeout(openLove,1000);else if(S.stage==='egg'&&S.warmth===0)setTimeout(()=>toast('Tap the egg to keep it warm '+ic('egg')),900);
    else if(S.stage==='born')setTimeout(greet,900)};
}
